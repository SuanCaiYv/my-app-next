name: Build Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --bin personal-studio --target x86_64-pc-windows-msvc

      - name: Stage release files
        shell: pwsh
        run: |
          $stage = "personal-studio-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/personal-studio.exe" $stage/
          Copy-Item -Recurse "static" $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-studio-windows-x64
          path: personal-studio-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: personal-studio-windows-x64.zip
