name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --bundles dmg
            artifact-name: macos-dmg
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: windows-latest
            args: --bundles nsis
            artifact-name: windows-installer
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache cargo-tauri
        id: tauri-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: ${{ runner.os }}-cargo-tauri-v2

      - name: Install cargo-tauri
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2"

      - name: Build
        run: |
          cd src-tauri
          cargo tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-path }}
